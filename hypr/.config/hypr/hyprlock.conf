# hyprlock (0.9.5) - Nox lock screen. Started by hypridle's lock_cmd
# (`loginctl lock-session` -> `pidof hyprlock || hyprlock`), e.g. Super+L.
#
# Everything visual is generated from the design tokens by `nox theme`:
#   hyprlock/colors.conf  -> ~/.local/state/nox/out/hyprlock/colors.conf
#                            ($text_color, $accent_color, ... for hand-written widgets)
#   hyprlock/layout.conf  -> ~/.local/state/nox/out/hyprlock/layout-<style>.conf
#                            general + animations + background + all widgets.
#                            <style> = token lock.style, else card.style:
#                            flat = Ember / Sequoia / Minimal, hairline = Telemetry.
# Both files are written by `nox theme apply` (they are git-ignored). Templates:
#   ~/.config/nox/templates/hyprlock/{colors,ember,telemetry}.conf
# Switching look (`nox theme switch telemetry`) re-renders and re-applies them.
#
# If layout.conf is missing, hyprlock logs a config error and still locks (bare
# background; typing the password + Enter still unlocks). Fix: `nox theme apply`.
#
# Preview: run `hyprlock` yourself from a terminal and unlock with your password.
# If it ever crashes while locked (red "lockdead" screen): Ctrl+Alt+F3, log in, then
#   hyprctl --instance 0 dispatch 'hl.dsp.exec_cmd("hyprlock")'
# (misc.allow_session_lock_restore is on in nox/input.lua) and unlock there.

source = ~/.config/hypr/hyprlock/colors.conf
source = ~/.config/hypr/hyprlock/layout.conf
