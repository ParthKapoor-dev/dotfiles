# hypridle - idle / sleep policy. Lock screen = hyprlock (hyprlock.conf).
# Every path to the lock goes through logind: Super+L, the session menu and the
# idle timeout call `loginctl lock-session`, which makes hypridle run lock_cmd.
# Screen power goes through graphite-dpms (works under the Lua and the .conf
# config; `hyprctl dispatch dpms off` alone is a syntax error under Lua).

$lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = graphite-dpms on          # screens back on after resume
    inhibit_sleep = 3                           # wait for the lock to be up before sleeping
}

listener {
    timeout = 300 # 5mins
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600 # 10mins
    on-timeout = graphite-dpms off
    on-resume = graphite-dpms on
}

listener {
    timeout = 900 # 15mins
    on-timeout = $suspend_cmd
}
