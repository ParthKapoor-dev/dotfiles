# ######## EDITOR #########
#https://wiki.archlinux.org/title/Category:Text_editors
# for example: vi nano nvim ...

#env = EDITOR, vim

# Cursor consistency: without these, XWayland apps (Electron, Java, games)
# fall back to the default X cursor while native Wayland apps use Bibata.
env = XCURSOR_THEME, Bibata-Modern-Classic
env = XCURSOR_SIZE, 24
