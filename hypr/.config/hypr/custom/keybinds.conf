#!
##! Monitors
# Dual-monitor: push the CURRENT workspace to the other monitor (and follow it)
bind = Super+Alt, Right, movecurrentworkspacetomonitor, +1 # Move workspace to next monitor
bind = Super+Alt, Left, movecurrentworkspacetomonitor, -1 # Move workspace to previous monitor
# Dual-monitor: swap whatever is shown on the two monitors
bind = Super+Alt, Up, swapactiveworkspaces, current +1 # Swap workspaces between monitors


#!
##! Fixes (2026-10-17)
# Super+; / Super+' : let the jcode launchers (managed block at end of hyprland.conf) win.
# Upstream bound these to splitratio too, so both fired on every press.
unbind = Super, Semicolon
unbind = Super, Apostrophe
# AI selection summary (Ollama) — AI features removed
unbind = Super+Shift+Alt, mouse:273
# Text editor: upstream's kate/gnome-text-editor/emacs aren't installed. Same window as the `nv` shell function.
unbind = Super, X
bind = Super, X, exec, ghostty --gtk-single-instance=false --class=dev.neovim --title=nvim --config-file="$HOME/.config/nvim/ghostty.conf" -e nvim # Text editor (Neovim)
