# ─────────────────────────────────────────────────────────────
#  Visual retune — glass / macOS-leaning feel
#  This file is sourced AFTER hyprland/general.conf, so anything
#  here overrides the defaults. Delete this block to revert.
# ─────────────────────────────────────────────────────────────

general {
    # More breathing room between windows — the single biggest
    # "designed" cue. Tight gaps read as utilitarian; generous
    # gaps read as intentional layout.
    gaps_in  = 4
    gaps_out = 10

    # Hairline border in the coral accent. Inactive is fully
    # transparent so only the focused window is outlined.
    border_size = 2
    col.active_border   = rgba(E2603FAA)
    col.inactive_border = rgba(FFFFFF10)
}

decoration {
    # macOS window corners sit around 12px at this scale.
    rounding = 12
    rounding_power = 2

    blur {
        enabled = true
        xray = true             # sample the wallpaper only. false looks "deeper" but
                                # makes text unreadable when a translucent terminal
                                # sits over a bright page.
        special = true          # blur the special/scratchpad workspace too
        popups = true           # menus and popups get glass as well
        popups_ignorealpha = 0.4
        new_optimizations = true

        size = 8
        passes = 3
        noise = 0.012           # was 0.05 — less grain, cleaner glass
        contrast = 1.0
        brightness = 1.0
        vibrancy = 0.75         # saturates colour behind glass (the Apple look)
        vibrancy_darkness = 0.35
    }

    shadow {
        enabled = true
        range = 40
        offset = 0 8
        render_power = 3        # was 10 — lower = softer, wider falloff
        color = rgba(00000045)
        color_inactive = rgba(00000022)
    }

    # macOS does not dim unfocused windows; keep this barely-there.
    dim_inactive = true
    dim_strength = 0.03
    dim_special  = 0.25
}

animations {
    enabled = true

    # Apple-style easing: quick to start moving, long gentle settle,
    # and NO overshoot/bounce. The stock config uses springy curves
    # (0.42,1.67,...) — the >1 control point is what makes it bouncy.
    bezier = macDecel,  0.16, 1.00, 0.30, 1.00
    bezier = macEase,   0.32, 0.72, 0.00, 1.00
    bezier = macSoft,   0.25, 0.10, 0.25, 1.00

    animation = windowsIn,   1, 3.5, macDecel, popin 92%
    animation = windowsOut,  1, 2.6, macEase,  popin 95%
    animation = windowsMove, 1, 3.4, macEase
    animation = fadeIn,      1, 3.0, macSoft
    animation = fadeOut,     1, 2.2, macSoft
    animation = border,      1, 6,   macSoft

    animation = layersIn,    1, 2.8, macDecel, popin 95%
    animation = layersOut,   1, 2.2, macEase,  popin 96%

    animation = workspaces,  1, 5.0, macEase, slide
    animation = specialWorkspaceIn,  1, 3.0, macDecel, slidevert
    animation = specialWorkspaceOut, 1, 2.0, macEase,  slidevert
}

misc {
    # Your panel is 144Hz. VRR can remove micro-stutter, but on some
    # laptop eDP panels it causes brightness flicker. 2 = only when a
    # window is fullscreen (the safe setting). Change to 0 if you see flicker.
    vrr = 2
}
