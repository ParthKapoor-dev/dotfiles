<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
 <alias>
  <family>sans-serif</family>
  <prefer>
   <family>Geist</family>
   <family>Apple Color Emoji</family>
  </prefer>
 </alias>
 <alias>
  <family>serif</family>
  <prefer>
   <family>Geist</family>
   <family>Apple Color Emoji</family>
  </prefer>
 </alias>
 <alias>
  <family>monospace</family>
  <prefer>
   <family>Geist Mono</family>
   <family>Apple Color Emoji</family>
  </prefer>
 </alias>
 <!-- emoji: Apple's set (AppleColorEmoji.ttf in ~/.local/share/fonts, from
      github.com/samuelngs/apple-emoji-ttf), Twemoji behind it for anything newer -->
 <alias binding="strong">
  <family>emoji</family>
  <prefer>
   <family>Apple Color Emoji</family>
   <family>Twemoji</family>
  </prefer>
 </alias>
 <match target="pattern">
  <test name="family"><string>Twemoji</string></test>
  <edit name="family" mode="prepend" binding="strong"><string>Apple Color Emoji</string></edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>
 <dir>~/.local/share/fonts</dir>
</fontconfig>
