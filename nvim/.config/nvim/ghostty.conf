# Ghostty overrides for the dedicated Neovim window (launched by `nv` in ~/.zshrc).
# Loaded on top of ~/.config/ghostty/config, so only the differences live here.

# Monaspace Neon for code, Monaspace Radon (handwritten cursive) for italics,
# so italic comments stand apart. Nerd Font icons come from Ghostty's built-in fallback.
font-family = "Monaspace Neon"
font-family-italic = "Monaspace Radon"
font-family-bold-italic = "Monaspace Radon"
font-size = 12
# calt = texture healing; ss01-ss08 = code ligatures (==, ->, </, |>, ...)
font-feature = calt
font-feature = liga
font-feature = ss01
font-feature = ss02
font-feature = ss03
font-feature = ss04
font-feature = ss05
font-feature = ss06
font-feature = ss07
font-feature = ss08
adjust-cell-height = 10%

# Match kanagawa-dragon so the window padding blends into the editor
background = #181616
foreground = #c5c9c5
cursor-color = #c8c093
selection-background = #2d4f67
selection-foreground = #c8c093
