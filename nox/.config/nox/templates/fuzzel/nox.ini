# Graphite fuzzel colours ({{ name }}, preset {{ _.preset }}) - generated by theme. Do not edit.
# fuzzel colours are RRGGBBAA.
[colors]
background={{ color.glass | alpha(glass.launcherAlpha) | stripa | lower }}
text={{ color.label | alpha(color.labelAlpha) | stripa | lower }}
prompt={{ color.label | alpha(color.label2Alpha) | stripa | lower }}
placeholder={{ color.label | alpha(color.label3Alpha) | stripa | lower }}
input={{ color.label | alpha(color.labelAlpha) | stripa | lower }}
match={{ color.accent | lighten(0.2) | stripa | lower }}
selection={{ color.accent | stripa | lower }}
selection-text={{ color.onAccent | stripa | lower }}
selection-match={{ color.onAccent | stripa | lower }}
counter={{ color.label | alpha(color.label3Alpha) | stripa | lower }}
border={{ color.label | alpha(color.hairAlpha) | stripa | lower }}
