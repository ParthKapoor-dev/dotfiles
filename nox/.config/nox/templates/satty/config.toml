# Nox ({{ name }}, preset {{ _.preset }}) - generated by nox theme. Do not edit.
# Source: ~/.config/nox/templates/satty/config.toml. Used by `nox shot annotate` (the screenshot
# card's Annotate), which also passes --filename/--output-filename (the capture itself),
# --copy-command and --early-exit. Enter = save back to the capture + copy, then the card returns.
[general]
initial-tool = "arrow"
copy-command = "wl-copy"
annotation-size-factor = 1.5
corner-roundness = 8
default-round-caps = true
primary-highlighter = "block"
disable-notifications = true
no-window-decoration = true
floating-hack = true
resize = { mode = "smart" }
brush-smooth-history-size = 6
actions-on-enter = ["save-to-file", "save-to-clipboard", "exit"]
actions-on-escape = ["exit"]
actions-on-right-click = []
title = "Annotate"
app-id = "org.satty.satty"

[font]
family = "{{ font.ui }}"
style = "Bold"

# theme accent first, then the status colours, white and black
[color-palette]
palette = [
  "{{ color.accent | hex }}",
  "{{ color.yellow | hex }}",
  "{{ color.green | hex }}",
  "{{ color.blue | hex }}",
  "#FFFFFF",
  "#000000",
]
