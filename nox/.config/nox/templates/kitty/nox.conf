# Nox terminal theme ({{ name }}, preset {{ _.preset }}) - generated by nox theme. Do not edit.
# Included at the END of ~/.config/kitty/kitty.conf, so it overrides inline colours.
foreground {{ terminal.foreground | hex }}
background {{ terminal.background | hex }}
cursor {{ terminal.cursor | hex }}
cursor_text_color {{ terminal.background | hex }}
selection_foreground {{ terminal.foreground | hex }}
selection_background {{ terminal.selection | hex }}
url_color {{ color.accent | lighten(0.2) | hex }}
active_border_color {{ color.accent | hex }}
inactive_border_color {{ color.raised | hex }}
active_tab_foreground {{ color.label | hex }}
active_tab_background {{ color.raised | hex }}
inactive_tab_foreground {{ color.label | alpha(color.label2Alpha) | over(color.surface) | hex }}
inactive_tab_background {{ color.surface | hex }}
tab_bar_background {{ color.bg | hex }}
mark1_foreground {{ terminal.background | hex }}
mark1_background {{ terminal.blue | hex }}
mark2_foreground {{ terminal.background | hex }}
mark2_background {{ terminal.yellow | hex }}
mark3_foreground {{ terminal.background | hex }}
mark3_background {{ terminal.magenta | hex }}
color0 {{ terminal.black | hex }}
