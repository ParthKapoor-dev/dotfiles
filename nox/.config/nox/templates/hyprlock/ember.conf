# Graphite hyprlock layout: "flat" card style = Ember / Sequoia / Minimal lock screen
# ({{ name }}, preset {{ _.preset }}). Generated by `theme` - do not edit; edit
# ~/.config/graphite/templates/hyprlock/ember.conf instead.
#
# Mock: lnx/design/mock (lock view, shots/ember-6-lock.png). Blurred + dimmed
# screenshot, date + thin clock at the top, now-playing line, avatar / name /
# pill password field at the bottom. Units: hyprlock positions and sizes are
# physical px (1920x1080 @1.25 here) or % of the monitor; font_size is pt
# (1 pt = 1.33 px). Font weight must be set with Pango markup (hyprlock resets the
# weight of font_family), hence the `info.sh span` wrappers. Vertical offsets are
# % so other resolutions keep the layout.
# Text sources: ~/.config/hypr/hyprlock/info.sh

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
}

animations {
    enabled = true
    bezier = graphiteEase, {{ motion.ease.0 }}, {{ motion.ease.1 }}, {{ motion.ease.2 }}, {{ motion.ease.3 }}
    animation = fadeIn, 1, {{ motion.sheetMs | mul(0.01) | round(1) }}, graphiteEase
    animation = fadeOut, 1, {{ motion.fade | mul(0.01) | round(1) }}, graphiteEase
    animation = inputFieldColors, 1, {{ motion.pop | mul(0.01) | round(1) }}, graphiteEase
    animation = inputFieldWidth, 1, {{ motion.pop | mul(0.01) | round(1) }}, graphiteEase
    animation = inputFieldDots, 1, {{ motion.pop | mul(0.01) | round(1) }}, graphiteEase
}

background {
    monitor =
    path = screenshot
    color = {{ color.page | hypr }}
    blur_passes = 3
    blur_size = 12
    noise = 0.012
    brightness = 0.6
    contrast = 0.9
    vibrancy = 0.25
    vibrancy_darkness = 0.1
}

# ---- status (top right): battery
label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/hyprlock/info.sh battery
    color = {{ color.label | alpha(color.labelAlpha) | hypr }}
    font_family = {{ font.ui }}
    font_size = 11
    position = -28, -18
    halign = right
    valign = top
}

# ---- date (letter-spaced caps) + clock
label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/hyprlock/info.sh span 'letter_spacing="3170"' date
    color = {{ color.label | alpha(0.85) | hypr }}
    font_family = {{ font.label }}
    font_size = 12
    position = 0, 38.2%
    halign = center
    valign = center
}

label {
    monitor =
    text = <span font_weight="{{ font.numericWeight }}">$TIME</span>
    color = {{ color.label | hypr }}
    font_family = {{ font.numeric }}
    font_size = 108
    position = 0, 30.2%
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(00000040)
}

# ---- now playing (empty when nothing plays)
label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/hyprlock/info.sh np
    color = {{ color.label | alpha(color.labelAlpha) | hypr }}
    font_family = {{ font.ui }}
    font_size = 11
    text_align = center
    position = 0, 16.2%
    halign = center
    valign = center
}

# ---- user: avatar (accent disc + initial; ~/.face on top when it exists)
shape {
    monitor =
    size = 78, 78
    rounding = -1
    color = {{ color.accent | hypr }}
    border_size = 1
    border_color = {{ color.label | alpha(0.25) | hypr }}
    position = 0, -23.95%
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 10
    shadow_color = rgba(00000066)
    zindex = 1
}

label {
    monitor =
    text = cmd[] ~/.config/hypr/hyprlock/info.sh span 'font_weight="600"' initial
    color = {{ color.label | hypr }}
    font_family = {{ font.display }}
    font_size = 24
    position = 0, -23.95%
    halign = center
    valign = center
    zindex = 2
}

image {
    monitor =
    path = ~/.face
    size = 78
    rounding = -1
    border_size = 0
    position = 0, -23.95%
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = cmd[] ~/.config/hypr/hyprlock/info.sh span 'font_weight="600"' name
    color = {{ color.label | hypr }}
    font_family = {{ font.ui }}
    font_size = 14
    position = 0, -30.07%
    halign = center
    valign = center
}

# ---- password pill + arrow button
input-field {
    monitor =
    size = 245, 39
    rounding = -1
    outline_thickness = 1
    outer_color = {{ color.label | alpha(0.25) | hypr }}
    inner_color = {{ color.label | alpha(color.fill3Alpha) | hypr }}
    font_color = {{ color.label | hypr }}
    font_family = {{ font.ui }}
    placeholder_text = <span alpha="60%">Enter Password</span>
    fail_text = <span alpha="85%">$FAIL</span>
    check_color = {{ color.accent | hypr }}
    fail_color = {{ color.red | hypr }}
    capslock_color = {{ color.orange | hypr }}
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = false
    position = 0, -34.14%
    halign = center
    valign = center
}

shape {
    monitor =
    size = 29, 29
    rounding = -1
    color = {{ color.label | alpha(0.2) | hypr }}
    border_size = 0
    position = 104, -34.14%
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = →
    color = {{ color.label | hypr }}
    font_family = {{ font.ui }}
    font_size = 10
    position = 104, -34.14%
    halign = center
    valign = center
    zindex = 2
}

# ---- hint: caps lock warning
label {
    monitor =
    text = cmd[update:500] ~/.config/hypr/hyprlock/info.sh caps
    color = {{ color.label | alpha(color.label2Alpha) | hypr }}
    font_family = {{ font.ui }}
    font_size = 10
    position = 0, -38%
    halign = center
    valign = center
}
