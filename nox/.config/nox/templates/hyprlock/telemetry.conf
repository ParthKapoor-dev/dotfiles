# Nox hyprlock layout: "hairline" card style = Telemetry lock screen
# ({{ name }}, preset {{ _.preset }}). Generated by `nox theme` - do not edit; edit
# ~/.config/nox/templates/hyprlock/telemetry.conf instead.
#
# Mock: lnx/design/mock (lock view, shots/telemetry-6-lock.png). Dot-matrix clock,
# letter-spaced date, now-playing line, and an ID-badge card: square avatar,
# NAME, HOST / SESSION / UPTIME / STATUS grid between hairlines, square password
# field with an accent button.
# Units: positions and sizes are physical px or % of the monitor (the card and
# everything left-aligned inside it use %, so they stay aligned on any 16:9
# monitor); font_size is pt (1 pt = 1.33 px). Font weight / tracking / Doto axes
# go through Pango markup (hyprlock resets the weight of font_family).
# Background: the wallpaper (as in the mock), see the background block.
# Text sources: ~/.config/hypr/hyprlock/info.sh

general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 2000
}

animations {
    enabled = true
    bezier = noxEase, {{ motion.ease.0 }}, {{ motion.ease.1 }}, {{ motion.ease.2 }}, {{ motion.ease.3 }}
    animation = fadeIn, 1, {{ motion.sheetMs | mul(0.01) | round(1) }}, noxEase
    animation = fadeOut, 1, {{ motion.fade | mul(0.01) | round(1) }}, noxEase
    animation = inputFieldColors, 1, {{ motion.pop | mul(0.01) | round(1) }}, noxEase
    animation = inputFieldWidth, 1, {{ motion.pop | mul(0.01) | round(1) }}, noxEase
    animation = inputFieldDots, 1, {{ motion.pop | mul(0.01) | round(1) }}, noxEase
}

background {
    monitor =
    # the desktop wallpaper (or the pinned lock image): `nox wallpaper lock-link` runs from
    # hypridle's lock_cmd; missing = plain page colour. Not a screenshot: no windows behind the
    # lock, and the NVIDIA screencopy came out with red and blue swapped
    path = ~/.local/state/nox/lock-wallpaper
    color = {{ color.page | hypr }}
    blur_passes = 0
    brightness = 0.75
}

# ---- status (top right): battery
label {
    monitor =
    text = cmd[update:30000] ~/.config/hypr/hyprlock/info.sh battery
    color = {{ color.label | alpha(color.labelAlpha) | hypr }}
    font_family = {{ font.label }}
    font_size = 10
    position = -28, -18
    halign = right
    valign = top
}

# ---- date + dot-matrix clock
label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/hyprlock/info.sh span 'letter_spacing="3170" font_weight="500"' date
    color = {{ color.label | alpha(0.7) | hypr }}
    font_family = {{ font.label }}
    font_size = 12
    position = 0, 38.2%
    halign = center
    valign = center
}

label {
    monitor =
    text = <span font_desc="{{ font.numeric }} @wght={{ font.numericAxes.wght | default(800) }},ROND={{ font.numericAxes.ROND | default(100) }}">$TIME</span>
    color = {{ color.label | hypr }}
    font_family = {{ font.numeric }}
    font_size = 136
    position = 0, 27.1%
    halign = center
    valign = center
}

# ---- now playing (empty when nothing plays)
label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/hyprlock/info.sh span 'letter_spacing="512"' np upper
    color = {{ color.label | alpha(color.labelAlpha) | hypr }}
    font_family = {{ font.label }}
    font_size = 10
    text_align = center
    position = 0, 11.7%
    halign = center
    valign = center
}

# ---- ID badge card
shape {
    monitor =
    size = 22.03%, 33.06%
    rounding = {{ radius.panel | mul(1.22) | int }}
    color = {{ color.page | lighten(0.02) | hypr }}
    border_size = 1
    border_color = {{ color.label | alpha(color.hairAlpha) | hypr }}
    position = 0, -22.25%
    halign = center
    valign = center
    zindex = 0
}

# avatar: square tile + initial (~/.face on top when it exists)
shape {
    monitor =
    size = 54, 54
    rounding = {{ radius.control | mul(1.22) | int }}
    color = {{ color.surface | hypr }}
    border_size = 1
    border_color = {{ color.label | alpha(0.22) | hypr }}
    position = -8.35%, -10.25%
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[] ~/.config/hypr/hyprlock/info.sh span 'font_desc="{{ font.numeric }} @wght={{ font.numericAxes.wght | default(800) }},ROND={{ font.numericAxes.ROND | default(100) }}"' initial
    color = {{ color.label | hypr }}
    font_family = {{ font.numeric }}
    font_size = 20
    position = -8.35%, -10.25%
    halign = center
    valign = center
    zindex = 2
}

image {
    monitor =
    path = ~/.face
    size = 54
    rounding = {{ radius.control | mul(1.22) | int }}
    border_size = 0
    position = -8.35%, -10.25%
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = cmd[] ~/.config/hypr/hyprlock/info.sh span 'letter_spacing="1880" font_weight="500"' name upper
    color = {{ color.label | hypr }}
    font_family = {{ font.label }}
    font_size = 18
    position = 40.24%, -15.57%
    halign = left
    valign = center
    zindex = 1
}

# hairlines around the meta grid
shape {
    monitor =
    size = 19.5%, 1
    color = {{ color.label | alpha(color.hairAlpha) | hypr }}
    position = 0, -18.29%
    halign = center
    valign = center
    zindex = 1
}

shape {
    monitor =
    size = 19.5%, 1
    color = {{ color.label | alpha(color.hairAlpha) | hypr }}
    position = 0, -27.92%
    halign = center
    valign = center
    zindex = 1
}

# meta grid: keys (dim) / values; column 1 at 40.24%, column 2 at 50.45%
label {
    monitor =
    text = <span letter_spacing="512">HOST</span>
    color = {{ color.label | alpha(0.4) | hypr }}
    font_family = {{ font.label }}
    font_size = 8
    position = 40.24%, -20.33%
    halign = left
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[] ~/.config/hypr/hyprlock/info.sh span 'letter_spacing="512" font_weight="500"' host
    color = {{ color.label | alpha(color.labelAlpha) | hypr }}
    font_family = {{ font.label }}
    font_size = 10
    position = 40.24%, -21.8%
    halign = left
    valign = center
    zindex = 1
}

label {
    monitor =
    text = <span letter_spacing="512">UPTIME</span>
    color = {{ color.label | alpha(0.4) | hypr }}
    font_family = {{ font.label }}
    font_size = 8
    position = 40.24%, -24.18%
    halign = left
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/hyprlock/info.sh span 'letter_spacing="512" font_weight="500"' uptime
    color = {{ color.label | alpha(color.labelAlpha) | hypr }}
    font_family = {{ font.label }}
    font_size = 10
    position = 40.24%, -25.88%
    halign = left
    valign = center
    zindex = 1
}

label {
    monitor =
    text = <span letter_spacing="512">SESSION</span>
    color = {{ color.label | alpha(0.4) | hypr }}
    font_family = {{ font.label }}
    font_size = 8
    position = 50.45%, -20.33%
    halign = left
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[] ~/.config/hypr/hyprlock/info.sh span 'letter_spacing="512" font_weight="500"' session
    color = {{ color.label | alpha(color.labelAlpha) | hypr }}
    font_family = {{ font.label }}
    font_size = 10
    position = 50.45%, -21.8%
    halign = left
    valign = center
    zindex = 1
}

label {
    monitor =
    text = <span letter_spacing="512">STATUS</span>
    color = {{ color.label | alpha(0.4) | hypr }}
    font_family = {{ font.label }}
    font_size = 8
    position = 50.45%, -24.18%
    halign = left
    valign = center
    zindex = 1
}

label {
    monitor =
    text = <span letter_spacing="512" font_weight="600">LOCKED</span>
    color = {{ color.accent | hypr }}
    font_family = {{ font.label }}
    font_size = 10
    position = 50.45%, -25.88%
    halign = left
    valign = center
    zindex = 1
}

# ---- password field + accent button
input-field {
    monitor =
    size = 19.5%, 39
    rounding = {{ radius.control | mul(1.22) | int }}
    outline_thickness = 1
    outer_color = {{ color.label | alpha(0.22) | hypr }}
    inner_color = {{ color.bg | hypr }}
    font_color = {{ color.label | hypr }}
    font_family = {{ font.label }}
    placeholder_text = <span letter_spacing="1024" alpha="60%">Enter Password</span>
    fail_text = <span letter_spacing="512">$FAIL</span>
    check_color = {{ color.accent | hypr }}
    fail_color = {{ color.red | hypr }}
    capslock_color = {{ color.orange | hypr }}
    dots_size = 0.2
    dots_spacing = 0.4
    dots_rounding = 0
    dots_center = true
    fade_on_empty = false
    position = 0, -30.86%
    halign = center
    valign = center
    zindex = 1
}

shape {
    monitor =
    size = 29, 29
    rounding = {{ radius.control | mul(1.22) | int }}
    color = {{ color.accent | hypr }}
    position = 8.74%, -30.86%
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = →
    color = {{ color.onAccent | hypr }}
    font_family = {{ font.ui }}
    font_size = 10
    position = 8.74%, -30.86%
    halign = center
    valign = center
    zindex = 3
}

# ---- hint: caps lock warning
label {
    monitor =
    text = cmd[update:500] ~/.config/hypr/hyprlock/info.sh span 'letter_spacing="600"' caps
    color = {{ color.label | alpha(color.label2Alpha) | hypr }}
    font_family = {{ font.label }}
    font_size = 9
    position = 40.24%, -35.4%
    halign = left
    valign = center
    zindex = 1
}
