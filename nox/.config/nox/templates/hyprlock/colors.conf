# Nox hyprlock colours ({{ name }}, preset {{ _.preset }}) - generated by nox theme. Do not edit.
# Same variable names as the pre-nox generated version, so hyprlock.conf needs no change.
$text_color = {{ color.label | alpha(color.labelAlpha) | hypr }}
$entry_background_color = {{ color.label | alpha(color.fillAlpha) | hypr }}
$entry_border_color = {{ color.label | alpha(color.hairAlpha) | hypr }}
$entry_color = {{ color.label | alpha(color.labelAlpha) | hypr }}
$accent_color = {{ color.accent | hypr }}
$error_color = {{ color.red | hypr }}
$font_family = {{ font.ui }}
$font_family_clock = {{ font.display }}
$font_material_symbols = Material Symbols Rounded
$background_image = screenshot
