; Dolphin's default view for folders that have none yet (details, folders first, previews on):
; ~/.local/share/dolphin/view_properties/global/.directory (target "dolphin-view")
[Dolphin]
Version=4
ViewMode=1
PreviewsShown=true
SortFoldersFirst=true
SortHiddenLast=true
SortRole=text
SortOrder=0
VisibleRoles=Details_text,Details_size,Details_modificationtime,Details_type
