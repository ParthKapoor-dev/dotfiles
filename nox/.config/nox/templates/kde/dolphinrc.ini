; Dolphin behaviour (merged into ~/.config/dolphinrc by `nox theme apply`, target "dolphin"; Dolphin
; keeps writing its own window state there). Keys: /usr/share/config.kcfg/dolphin_*.kcfg
[General]
; every folder remembers its own view; new folders start from the defaults in
; ~/.local/share/dolphin/view_properties/global/.directory (target "dolphin-view")
GlobalViewProps=false
ShowFullPath=true
EditableUrl=false
ShowStatusBar=FullWidth
ShowZoomSlider=false
ShowSelectionToggle=false
ShowToolTips=true
RememberOpenedTabs=true
OpenExternallyCalledFolderInNewTab=true
OpenNewTabAfterLastTab=true
BrowseThroughArchives=true
ConfirmClosingMultipleTabs=false
UseTabForSwitchingSplitView=true
CloseSplitViewChoice=1
AutoExpandFolders=true
RenameInline=true
EnlargeSmallPreviews=false
HideXTrashFile=true

[MainWindow]
MenuBar=Disabled

[DetailsMode]
PreviewSize=22
ExpandableFolders=true
HighlightEntireRow=true

[CompactMode]
PreviewSize=22

[IconsMode]
PreviewSize=80
MaximumTextLines=2

[ContextMenu]
ShowCopyLocation=true
ShowOpenTerminal=true
ShowOpenInSplitView=true
ShowCopyToOtherSplitView=true
ShowMoveToOtherSplitView=true
ShowDuplicateHere=true
ShowAddToPlaces=true
ShowSortBy=false
ShowViewMode=false
ShowOpenInNewWindow=false

[VersionControl]
enabledPlugins=Git

[InformationPanel]
previewsShown=true
previewsAutoPlay=true

[ContentDisplay]
DirectorySizeMode=ContentSize
RecursiveDirectorySizeLimit=20
UsePermissionsFormat=CombinedFormat
