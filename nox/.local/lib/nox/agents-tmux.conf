# tmux for agents started from nox (`nox agents start`, launcher ">"): its own server
# (tmux -L nox-agents) so `nox agents send` can type replies into the session without focusing
# its window. Deliberately not ~/.config/tmux/tmux.conf: no plugins, no status bar, no restore.
set -g default-terminal "tmux-256color"
set -sa terminal-overrides ",*:Tc"
set -s escape-time 0
set -s extended-keys on
set -as terminal-features "xterm*:extkeys"
set -s set-clipboard on
set -g allow-passthrough on
set -g focus-events on
set -g mouse on
set -g history-limit 50000
set -g status off
set -g set-titles on
set -g set-titles-string "#{session_name} · #{pane_current_command}"
set -g destroy-unattached off
set -g exit-empty on
