; cava for the desktop widgets' audio bars (modules/desktop/Widgets.qml): 24 bars, 0..6 each,
; one "v;v;v;...;" line per frame on stdout. Only runs while music plays on an empty desktop.
[general]
bars = 24
framerate = 24
autosens = 1
lower_cutoff_freq = 50
higher_cutoff_freq = 10000

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 6
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 70
