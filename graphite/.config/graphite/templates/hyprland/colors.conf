# Graphite Hyprland colours (hyprlang) ({{ name }}, preset {{ _.preset }}) - generated by graphite-theme.
# Legacy target for the current hyprlang config only; the Lua config reads ~/.local/state/graphite/tokens.lua instead.
general {
    col.active_border = {{ color.label | alpha(color.hairAlpha) | hypr }}
    col.inactive_border = {{ color.label | alpha(color.sepAlpha) | hypr }}
}

misc {
    background_color = {{ color.page | hypr }}
}

plugin {
    hyprbars {
        bar_text_font = {{ font.ui }}, {{ font.display }}, sans-serif
        bar_height = {{ size.menubar }}
        bar_padding = 10
        bar_button_padding = 5
        bar_precedence_over_border = true
        bar_part_of_window = true
        bar_color = {{ color.surface | hypr }}
        col.text = {{ color.label | alpha(color.labelAlpha) | hypr }}
        hyprbars-button = rgb({{ color.trafficClose | strip }}), 12, , hyprctl dispatch killactive
        hyprbars-button = rgb({{ color.trafficMin | strip }}), 12, , hyprctl dispatch movetoworkspacesilent special
        hyprbars-button = rgb({{ color.trafficZoom | strip }}), 12, , hyprctl dispatch fullscreen 1
    }
}

windowrule = border_color {{ color.accent | alpha(0.67) | hypr }} {{ color.accent | alpha(0.47) | hypr }}, match:pin 1
